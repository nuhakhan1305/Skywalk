
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Airway</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
    <a class="logo" href="/">✈ Airway</a>
    <nav><a href="/">Home</a><a href="{{ url_for('register') }}">Register</a></nav>
</header>

<main class="auth-wrapper">
    <section class="panel auth-panel">
        <p class="eyebrow">WELCOME BACK</p>
        <h1>Log in to Airway</h1>
        <p>Access your account and manage your bookings.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" class="auth-form">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email"
                   autocomplete="email" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   autocomplete="current-password" required>

            <button type="submit">Log in</button>
        </form>

        <p class="auth-switch">New to Airway?
            <a href="{{ url_for('register') }}">Create an account</a>
        </p>
    </section>
</main>
</body>
</html>
