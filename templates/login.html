
{% extends "base.html" %}
{% block title %}Login | Airway{% endblock %}

{% block content %}
<section class="auth-wrap">
    <div class="auth-card">
        <div class="auth-icon">✈</div>
        <h1>Welcome back</h1>
        <p class="muted center">Log in to search flights and manage your bookings.</p>

        <form method="POST" class="form">
            <label for="email">Email address</label>
            <input id="email" type="email" name="email"
                   autocomplete="email" required>

            <label for="password">Password</label>
            <input id="password" type="password" name="password"
                   autocomplete="current-password" required>

            <button class="button primary full" type="submit">Login</button>
        </form>

        <p class="center">New to Airway?
            <a href="{{ url_for('register') }}">Create an account</a>
        </p>
    </div>
</section>
{% endblock %}
