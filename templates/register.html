
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Airway</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
    <a class="logo" href="/">✈ Airway</a>
    <nav><a href="/">Home</a><a href="{{ url_for('login') }}">Login</a></nav>
</header>

<main class="auth-wrapper">
    <section class="panel auth-panel">
        <p class="eyebrow">JOIN AIRWAY</p>
        <h1>Create your account</h1>
        <p>Register to book flights and manage your trips.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" class="auth-form">
            <label for="username">Full name</label>
            <input id="username" name="username" type="text"
                   maxlength="80" autocomplete="name" required>

            <label for="email">Email address</label>
            <input id="email" name="email" type="email"
                   autocomplete="email" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   minlength="8" autocomplete="new-password" required>

            <label for="confirm_password">Confirm password</label>
            <input id="confirm_password" name="confirm_password"
                   type="password" minlength="8"
                   autocomplete="new-password" required>

            <button type="submit">Create account</button>
        </form>

        <p class="auth-switch">Already registered?
            <a href="{{ url_for('login') }}">Log in</a>
        </p>
    </section>
</main>

</body>
</html>
