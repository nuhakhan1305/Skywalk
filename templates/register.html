
{% extends "base.html" %}
{% block title %}Register | Airway{% endblock %}

{% block content %}
<section class="auth-wrap">
    <div class="auth-card">
        <div class="auth-icon">✈</div>
        <h1>Create your account</h1>
        <p class="muted center">A few details and you are ready to explore.</p>

        <form method="POST" class="form">
            <label for="username">Full name</label>
            <input id="username" type="text" name="username"
                   minlength="2" maxlength="70" required>

            <label for="email">Email address</label>
            <input id="email" type="email" name="email"
                   autocomplete="email" required>

            <label for="password">Password (at least 8 characters)</label>
            <input id="password" type="password" name="password"
                   minlength="8" autocomplete="new-password" required>

            <label for="confirm_password">Confirm password</label>
            <input id="confirm_password" type="password"
                   name="confirm_password" minlength="8"
                   autocomplete="new-password" required>

            <button class="button primary full" type="submit">Create account</button>
        </form>

        <p class="center">Already registered?
            <a href="{{ url_for('login') }}">Login</a>
        </p>
    </div>
</section>
{% endblock %}
